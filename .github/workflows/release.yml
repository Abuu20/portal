name: Build and publish the .deb

# Builds dist/portal-osint_*_all.deb on every push to main and publishes it to the
# *public* Abuu20/portal-releases repo as a rolling "latest" release (this repo,
# portal, is private -- portal-releases holds only the built .deb, no source --
# so the install/update one-liner in the README can keep working with no token).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build-deb.sh reads git history for the version string

      - name: Build package
        working-directory: portal
        run: ./build-deb.sh

      - name: Publish rolling "latest" release to portal-releases
        working-directory: portal
        run: |
          gh release delete latest --yes --cleanup-tag -R Abuu20/portal-releases 2>/dev/null || true
          gh release create latest dist/*.deb \
            -R Abuu20/portal-releases \
            --title "PORTAL (latest build)" \
            --notes "Automatically built from a private-repo commit on $(date -u +%F). Install: curl -fsSL https://raw.githubusercontent.com/Abuu20/portal-releases/main/install.sh | sudo bash" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
